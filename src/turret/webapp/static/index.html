<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #ff4d4d;
    --accent2: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #3ddc84; margin-right: 6px;
  }

  main { padding: 20px 24px 40px; max-width: 1100px; margin: 0 auto; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 860px) {
    .grid { grid-template-columns: 3fr 2fr; }
  }

  .preview {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }
  .preview img {
    display: block;
    width: 100%;
    max-height: 480px;
    object-fit: contain;
  }

  .tune-group { margin-bottom: 18px; }
  .tune-group:last-child { margin-bottom: 0; }
  .tune-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 10px;
  }
  .tune-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tune-row:last-child { margin-bottom: 0; }
  .tune-row label { flex: 0 0 132px; font-size: 13px; }
  .tune-row input[type=range] { flex: 1; accent-color: var(--accent2); }
  .tune-row .val {
    flex: 0 0 68px; text-align: right; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .stats { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 120px;
  }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .feed { display: flex; flex-direction: column; gap: 8px; }
  .event {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .event.fired { border-left-color: var(--accent); }
  .event .left { display: flex; align-items: center; gap: 10px; }
  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; letter-spacing: .03em;
  }
  .badge.sighting { background: rgba(77,163,255,.15); color: var(--accent2); }
  .badge.fired { background: rgba(255,77,77,.15); color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); }
  .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>🎯 Turret Dashboard</h1>
  <div class="status"><span class="dot"></span>Live, updates every 2s</div>
</header>

<main>
  <div class="grid">
    <section class="panel">
      <h2>Live Preview</h2>
      <div class="preview">
        <img id="cam" src="/api/stream.mjpg" alt="camera feed"
             onerror="this.onerror=null; this.remove(); document.getElementById('camEmpty').style.display='block';">
        <div class="empty" id="camEmpty" style="display:none;">No camera feed</div>
      </div>
    </section>

    <section class="panel" id="tuningPanel">
      <h2>Tuning</h2>
      <div id="tuningGroups"></div>
      <div class="empty" id="tuningEmpty" style="display:none;">Tuning unavailable</div>
    </section>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="statSightings">0</div><div class="l">Sightings</div></div>
    <div class="stat"><div class="n" id="statFired">0</div><div class="l">Fired</div></div>
  </div>

  <section class="panel">
    <h2>Activity</h2>
    <div class="feed" id="feed">
      <div class="empty">Waiting for events…</div>
    </div>
  </section>
</main>

<script>
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString(undefined, {
    month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

function renderEvent(ev) {
  const div = document.createElement("div");
  div.className = "event " + (ev.kind === "fired" ? "fired" : "");
  const posText = (ev.cx != null && ev.cy != null)
    ? `at (${ev.cx}, ${ev.cy})` + (ev.area != null ? `, area ${Math.round(ev.area)}px²` : "")
    : (ev.note || "");
  div.innerHTML = `
    <div class="left">
      <span class="badge ${ev.kind}">${ev.kind === "fired" ? "Fired" : "Sighting"}</span>
      <span class="meta">${posText}</span>
    </div>
    <span class="time">${fmtTime(ev.ts)}</span>
  `;
  return div;
}

async function refreshEvents() {
  try {
    const res = await fetch("/api/events?limit=100");
    const data = await res.json();
    document.getElementById("statSightings").textContent = data.counts.sighting || 0;
    document.getElementById("statFired").textContent = data.counts.fired || 0;

    const feed = document.getElementById("feed");
    feed.innerHTML = "";
    if (data.events.length === 0) {
      feed.innerHTML = '<div class="empty">Waiting for events…</div>';
      return;
    }
    for (const ev of data.events) {
      feed.appendChild(renderEvent(ev));
    }
  } catch (e) {
    console.error("Failed to refresh events", e);
  }
}

refreshEvents();
setInterval(refreshEvents, 2000);

// --- Live tuning -----------------------------------------------------

const TUNABLES = [
  { key: "kp_yaw", label: "Yaw gain", group: "Tracking", step: 0.005, decimals: 3 },
  { key: "kp_pitch", label: "Pitch gain", group: "Tracking", step: 0.005, decimals: 3 },
  { key: "deadband_px", label: "Deadband", group: "Tracking", step: 1, decimals: 0, unit: "px" },
  { key: "center_tol_px", label: "Center tolerance", group: "Fire", step: 1, decimals: 0, unit: "px" },
  { key: "min_area_px", label: "Min area", group: "Fire", step: 100, decimals: 0, unit: "px²" },
  { key: "dwell_s", label: "Dwell time", group: "Fire", step: 0.05, decimals: 2, unit: "s" },
  { key: "cooldown_s", label: "Cooldown", group: "Fire", step: 0.1, decimals: 1, unit: "s" },
  { key: "conf_threshold", label: "Confidence threshold", group: "Detection", step: 0.01, decimals: 2 },
];

function fmtTuneVal(value, tunable) {
  const s = Number(value).toFixed(tunable.decimals);
  return tunable.unit ? `${s}${tunable.unit}` : s;
}

function renderTuning(values, bounds) {
  const groups = [];
  for (const t of TUNABLES) {
    let g = groups.find((g) => g.name === t.group);
    if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
    g.items.push(t);
  }

  const container = document.getElementById("tuningGroups");
  container.innerHTML = "";
  for (const group of groups) {
    const groupDiv = document.createElement("div");
    groupDiv.className = "tune-group";
    groupDiv.innerHTML = `<div class="tune-group-label">${group.name}</div>`;
    for (const t of group.items) {
      const [lo, hi] = bounds[t.key];
      const row = document.createElement("div");
      row.className = "tune-row";
      row.innerHTML = `
        <label for="tune-${t.key}">${t.label}</label>
        <input type="range" id="tune-${t.key}" min="${lo}" max="${hi}" step="${t.step}" value="${values[t.key]}">
        <span class="val" id="tune-${t.key}-val">${fmtTuneVal(values[t.key], t)}</span>
      `;
      groupDiv.appendChild(row);
    }
    container.appendChild(groupDiv);
  }

  let debounceTimer = null;
  container.querySelectorAll("input[type=range]").forEach((input) => {
    const key = input.id.replace("tune-", "");
    const tunable = TUNABLES.find((t) => t.key === key);
    input.addEventListener("input", () => {
      document.getElementById(`tune-${key}-val`).textContent = fmtTuneVal(input.value, tunable);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => postTuning(key, parseFloat(input.value)), 150);
    });
  });
}

async function postTuning(key, value) {
  try {
    const res = await fetch("/api/tuning", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [key]: value }),
    });
    if (!res.ok) return;
    const data = await res.json();
    const tunable = TUNABLES.find((t) => t.key === key);
    const input = document.getElementById(`tune-${key}`);
    // Reconcile with the (possibly clamped) server value, but don't yank
    // the slider out from under an in-progress drag.
    if (input && document.activeElement !== input) {
      input.value = data.values[key];
    }
    document.getElementById(`tune-${key}-val`).textContent = fmtTuneVal(data.values[key], tunable);
  } catch (e) {
    console.error("Failed to update tuning", e);
  }
}

async function initTuning() {
  try {
    const res = await fetch("/api/tuning");
    if (!res.ok) throw new Error("tuning unavailable");
    const data = await res.json();
    renderTuning(data.values, data.bounds);
  } catch (e) {
    document.getElementById("tuningGroups").style.display = "none";
    document.getElementById("tuningEmpty").style.display = "block";
  }
}

initTuning();
</script>

</body>
</html>
