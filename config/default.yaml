# Turret configuration. Any field omitted here falls back to the defaults in
# src/turret/config.py. Pin numbers are BCM.

axes:
  yaw:
    backend: servo
    servo:
      pin: 17
      min_us: 500        # SG92R calibration — verify with scripts/axis_test.py
      max_us: 2400
      min_angle: 20.0
      max_angle: 160.0
      start_angle: 90.0
      max_deg_per_s: 120.0
  pitch:
    backend: servo
    servo:
      pin: 27
      min_us: 500
      max_us: 2400
      min_angle: 45.0
      max_angle: 135.0
      start_angle: 90.0
      max_deg_per_s: 120.0
  roll:
    backend: servo
    servo:
      pin: 5
      min_us: 500        # SG92R calibration — verify with scripts/axis_test.py
      max_us: 2400
      min_angle: 0.0
      max_angle: 90.0
      start_angle: 0.0    # rest position — trigger not engaged
      max_deg_per_s: 400.0  # fast pull for a snappy trigger action

camera:
  backend: auto        # auto | picamera2 | opencv
  device: 0
  width: 640
  height: 480
  fps: 30

detection:
  red_low_1: [0, 120, 70]
  red_high_1: [10, 255, 255]
  red_low_2: [170, 120, 70]
  red_high_2: [180, 255, 255]
  blur_ksize: 5
  morph_ksize: 5
  min_area_px: 400
  max_aspect: 4.0

# Which detector feeds the tracker.
#   hsv        - HSV red-blob threshold (default; no model file needed)
#   tflite     - SSD-MobileNet-V2 COCO via ai-edge-litert (LiteRT); recommended
#                ML backend on a Pi 4 -- needs: pip install -e '.[ml]'  +  a
#                64-bit (aarch64) OS
#   opencv_dnn - NanoDet-Plus (int8) via cv2.dnn — no extra pip install;
#                fallback for when LiteRT isn't available (e.g. 32-bit OS).
#                Smaller and less accurate than the tflite model.
# Both ML backends need model files: python scripts/download_models.py --set all
# opencv_dnn also needs model_path overridden below (it defaults to the
# tflite model path) -- see the model_path comment.
detector_backend: hsv

ml_detection:
  # Default is the tflite model. For detector_backend: opencv_dnn, override
  # this to models/object_detection_nanodet_2022nov_int8bq.onnx (e.g. via
  # --model on the CLI).
  model_path: models/ssd_mobilenet_v2_coco_quant_postprocess.tflite
  labels_path: models/coco_labels.txt   # tflite backend only
  target_classes: [person]
  conf_threshold: 0.5
  num_threads: 2                        # tflite backend only
  input_size: 416                       # opencv_dnn backend only (NanoDet architecture constant)
  nms_iou_threshold: 0.6                # opencv_dnn backend only (NanoDet has no baked-in NMS)

# NOTE: fire.min_area_px below is calibrated for HSV *contour* area. The ML
# backends report full-person *bounding-box* area (w*h), which is typically
# 5-20x larger at the same distance. Retune min_area_px (with
# scripts/ml_tune.py) before switching detector_backend away from "hsv" and
# enabling fire.mode: servo_pull — otherwise the turret will consider itself
# "in range" from much farther away than intended.

control:
  kp_yaw: 0.05         # deg of correction per px of error
  kp_pitch: 0.05
  deadband_px: 15
  max_step_deg: 4.0
  lost_target_timeout_s: 2.0

fire:
  mode: log            # log | roll_spin | servo_pull
  center_tol_px: 25
  min_area_px: 3000
  dwell_s: 0.5
  cooldown_s: 2.0
  spin_duration_s: 1.0        # roll_spin only
  trigger_pull_angle: 90.0    # servo_pull only: angle when pulled
  trigger_hold_s: 0.15        # servo_pull only: how long to hold before releasing

allow_mock_fallback: true
